<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://upload.wikimedia.org/wikipedia/commons/4/47/Blue_sky_with_sun.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .taskbar {
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            height: 40px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .taskbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .taskbar li {
            display: inline;
            margin-right: 10px;
        }

        .desktop {
            padding: 20px;
        }

        .icon {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            color: #000;
        }

        .icon img {
            width: 40px;
            height: 40px;
            display: block;
            margin: 0 auto;
        }

        .icon:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        #windows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            overflow: auto;
        }

        .window {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 80%;
            max-width: 800px;
            padding: 20px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
        }

        .start-menu {
            position: fixed;
            bottom: 40px;
            left: 10px;
            width: 300px;
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            border-radius: 5px;
            display: none;
            z-index: 1001;
            padding: 10px;
        }

        .start-menu ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .start-menu li {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .start-menu li:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .start-menu a {
            color: #fff;
            text-decoration: none;
        }
        .static-popup {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 300px;
            padding: 20px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none; /* Initially hidden */
        }
    </style>
</head>
<body>
    <div class="desktop">
        <div class="icon" id="recycle-bin">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Recycle_Bin_icon.png" alt="Recycle Bin">
            <span>Recycle Bin</span>
        </div>
        <div class="icon" id="edge">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Microsoft_Edge_logo_%282020%29.svg" alt="Microsoft Edge">
            <span>Microsoft Edge</span>
        </div>
        <div class="icon" id="logitech">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Logitech_logo.svg" alt="Logitech G HUB">
            <span>Logitech G HUB</span>
        </div>
        <button id="open-popup">Open Popup</button>
        <div class="static-popup" id="static-popup">
            <span class="close-btn" onclick="closeStaticPopup()">X</span>
            <h2>Static Popup</h2>
            <p>This is a static popup window.</p>
        </div>
    </div>
    <nav class="taskbar">
        <ul>
            <li id="start-button">🔲</li>
            <li><a href="#search">🔍 Type here to search</a></li>
        </ul>
        <ul>
            <li><a href="#wifi">📶</a></li>
            <li><a href="#battery">🔋</a></li>
            <li><a href="#volume">🔊</a></li>
            <li id="date-time"></li>
        </ul>
    </nav>
    <div class="start-menu" id="start-menu">
        <ul>
            <li><a href="#home">🏠 Home</a></li>
            <li><a href="#about">ℹ️ About</a></li>
            <li><a href="#portfolio">📁 Portfolio</a></li>
            <li><a href="#contact">📞 Contact</a></li>
        </ul>
    </div>
    <div id="windows">
        <!-- Windows will be dynamically loaded here -->
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var icons = document.querySelectorAll('.icon');

            icons.forEach(function(icon) {
                icon.addEventListener('click', function() {
                    var windowId = this.id + "-window";
                    var existingWindow = document.getElementById(windowId);

                    if (!existingWindow) {
                        var windowContent = document.createElement('div');
                        windowContent.classList.add('window');
                        windowContent.setAttribute('id', windowId);
                        windowContent.innerHTML = "<span class='close-btn' onclick='closeWindow(\"" + windowId + "\")'>X</span><h2>" + this.querySelector('span').textContent + "</h2><p>This is the content of " + this.querySelector('span').textContent + " window.</p>";
                        document.getElementById('windows').appendChild(windowContent);
                    } else {
                        existingWindow.style.display = "block";
                    }
                });
            });

            var startButton = document.getElementById('start-button');
            var startMenu = document.getElementById('start-menu');

            startButton.addEventListener('click', function() {
                startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
            });

            window.addEventListener('click', function(event) {
                if (!startButton.contains(event.target) && !startMenu.contains(event.target)) {
                    startMenu.style.display = 'none';
                }
            });

            function updateTime() {
                var now = new Date();
                var hours = now.getHours();
                var minutes = now.getMinutes();
                var ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // the hour '0' should be '12'
                minutes = minutes < 10 ? '0' + minutes : minutes;
                var strTime = hours + ':' + minutes + ' ' + ampm;
                document.getElementById('date-time').innerHTML = strTime;
            }

            updateTime(); // initial call
            setInterval(updateTime, 60000); // update every minute
        });

        function closeWindow(id) {
            var window = document.getElementById(id);
            window.style.display = "none";
        }
        
    </script>
</body>
</html>
