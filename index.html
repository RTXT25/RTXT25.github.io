<!DOCTYPE html>
<html>
<head>
    <title>Background Changer</title>
    <style>
        body {
            background-image: url('/png/PKlogo');
            background-size: cover;
            transition: background 0.5s ease-in-out;
        }
    </style>
    <script>
        function changeBackground(imageName) {
            document.body.style.backgroundColor = 'orange';
            setTimeout(function() {
                document.body.style.backgroundImage = "url('" + imageName + "')";
                document.body.style.backgroundColor = '';
            }, 1000);
        }

        function changeColor(color) {
            document.body.style.backgroundColor = 'black';
            setTimeout(function() {
                document.body.style.backgroundImage = 'none';
                document.body.style.backgroundColor = color;
            }, 1000);
        }
    </script>
</head>
<body>
    <button onclick="changeBackground('image1.jpg')">Change to Image 1</button>
    <button onclick="changeBackground('image2.jpg')">Change to Image 2</button>
    <button onclick="changeBackground('image3.jpg')">Change to Image 3</button>
    <button onclick="changeColor('red')">Change to Red</button>
    <button onclick="changeColor('blue')">Change to Blue</button>
    <button onclick="changeColor('green')">Change to Green</button>
    <!-- Add more buttons as needed -->
</body>
</html>
