<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://upload.wikimedia.org/wikipedia/commons/4/47/Blue_sky_with_sun.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .taskbar {
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            height: 40px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .taskbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .taskbar li {
            display: inline;
            margin-right: 10px;
        }

        .desktop {
            padding: 20px;
        }

        .icon {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            color: #000;
        }

        .icon img {
            width: 40px;
            height: 40px;
            display: block;
            margin: 0 auto;
        }

        .icon:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        #windows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            overflow: auto;
        }

        .window {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 80%;
            max-width: 800px;
            padding: 20px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
        }

        .start-menu {
            position: fixed;
            bottom: 40px;
            left: 10px;
            width: 300px;
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            border-radius: 5px;
            display: none;
            z-index: 1001;
            padding: 10px;
        }

        .start-menu ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .start-menu li {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .start-menu li:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .start-menu a {
            color: #fff;
            text-decoration: none;
        }
        .static-popup {
            background-color: #f4f4f4;
            border: 1px solid #999;
            border-radius: 5px;
            width: 300px;
            padding: 20px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none; /* Initially hidden */
        }

        .static-popup .title-bar {
            background-color: #0078d7;
            color: #fff;
            padding: 8px 20px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        .static-popup h2 {
            margin-top: 0;
        }

        .static-popup p {
            margin-bottom: 0;
        }

        .static-popup .close-btn {
            color: #888;
            font-size: 18px;
        }

        .static-popup .close-btn:hover {
            color: #555;
        }
        .square-button {
        width: 100px; /* Adjust the width as needed */
        height: 100px; /* Set the same value as width to make it a square */
        text-align: center;
        background-color: #007bff; /* Default button color */
        color: #ffffff; /* Default text color */
        border: none;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <div class="desktop">
        <button class="square-button" id="o1"><h1>ℹ️</h1></button>
        <button class="square-button" id="o2"><h1>⛏️</h1></button>
        <button class="square-button" id="o3"><h1>💻</h1></button>
        <div class="static-popup" id="static-popup1">
            <span class="close-btn" onclick="closeStaticPopup('static-popup1')">X</span>
            <h2>Information</h2>
            <p>This is a static popup window.</p>
        </div>
        <div class="static-popup" id="static-popup2">
            <span class="close-btn" onclick="closeStaticPopup('static-popup2')">X</span>
            <h2>Minecraft STuff</h2>
            <p>This is a static popup window.</p>
        </div>
        <div class="static-popup" id="static-popup3">
            <span class="close-btn" onclick="closeStaticPopup('static-popup3')">X</span>
            <h2>Static Pasgdtfopup</h2>
            <p>This is a static popup window.</p>
        </div>
    </div>
    <nav class="taskbar">
        <ul>
            <li id="start-button">🔲</li>
            <li><a href="#search">🔍 Type here to search</a></li>
        </ul>
        <ul>
            <li><a href="#wifi">📶</a></li>
            <li><a href="#battery">🔋</a></li>
            <li><a href="#volume">🔊</a></li>
            <li id="date-time"></li>
        </ul>
    </nav>
    <div class="start-menu" id="start-menu">
        <ul>
            <li><a href="#home">🏠 Home</a></li>
            <li><a href="#about">ℹ️ About</a></li>
            <li><a href="#portfolio">📁 Portfolio</a></li>
            <li><a href="#contact">📞 Contact</a></li>
        </ul>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var startButton = document.getElementById('start-button');
            var startMenu = document.getElementById('start-menu');

            startButton.addEventListener('click', function() {
                startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
            });

            window.addEventListener('click', function(event) {
                if (!startButton.contains(event.target) && !startMenu.contains(event.target)) {
                    startMenu.style.display = 'none';
                }
            });

            function updateTime() {
                var now = new Date();
                var hours = now.getHours();
                var minutes = now.getMinutes();
                var ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // the hour '0' should be '12'
                minutes = minutes < 10 ? '0' + minutes : minutes;
                var strTime = hours + ':' + minutes + ' ' + ampm;
                document.getElementById('date-time').innerHTML = strTime;
            }

            updateTime(); // initial call
            setInterval(updateTime, 60000); // update every minute
        });

        function closeWindow(id) {
            var window = document.getElementById(id);
            window.style.display = "none";
        }
        document.getElementById('o1').addEventListener('click', function() {
                var staticPopup = document.getElementById('static-popup1');
                staticPopup.style.display = 'block';
            });
        // Function to open the static popup
document.getElementById('o2').addEventListener('click', function() {
    var staticPopup = document.getElementById('static-popup2');
    staticPopup.style.display = 'block';
});

document.getElementById('o3').addEventListener('click', function() {
    var staticPopup = document.getElementById('static-popup3');
    staticPopup.style.display = 'block';
});

// Function to close the static popup
function closeStaticPopup(id) {
    var staticPopup = document.getElementById(id);
    staticPopup.style.display = 'none';
}
    </script>
</body>
</html>
